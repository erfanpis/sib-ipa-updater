# SibStar IPA auto-updater — 24/7 on GitHub Actions (same pattern as linkyar):
# each run lives ~4h45m, then requests the next run; cron every 30 min is the backup
# (a queued cron run waits behind the running one via the concurrency group).
# State is kept only ENCRYPTED (state.enc on the `state` branch); bot output is not printed.
name: updater

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      test_refs:
        description: "One-off test: comma list like blatants/13480 (bare ids = @blatants)"
        required: false
        default: ""
      test_mode:
        description: "draft (default) or publish (explicit approval, test items only)"
        required: false
        default: "draft"

permissions:
  contents: write
  actions: write

concurrency:
  group: sib-ipa-updater
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: State branch (encrypted)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          git config --global user.name "sib-ipa-updater"
          git config --global user.email "sib-ipa-updater@users.noreply.github.com"
          git fetch -q --depth 1 origin state:state
          git worktree add -q state state
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in state/state.enc -out state/state.json -pass env:STATE_KEY
          echo "state restored"

      - name: Run (about 4h45m)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          SIBSTAR_ENDPOINT_SECRET: ${{ secrets.SIBSTAR_ENDPOINT_SECRET }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          SIBSTAR_ENDPOINT: ${{ secrets.SIBSTAR_ENDPOINT }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          TEST_REFS: ${{ github.event.inputs.test_refs }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          PUBLISH_UNLOCKED: ${{ vars.PUBLISH_UNLOCKED }}
          STATE_DIR: state
          PYTHONUNBUFFERED: "1"
        run: |
          # public repo: bot output stays off the public Actions log (status goes to the admin bot)
          timeout --signal=SIGINT 17700 python bot/main.py > "$RUNNER_TEMP/bot.log" 2>&1 || code=$?
          echo "bot exited code=${code:-0} log_lines=$(wc -l < "$RUNNER_TEMP/bot.log")"
          if [ "${code:-0}" = "124" ] || [ "${code:-0}" = "0" ]; then exit 0; fi
          exit "${code:-1}"

      - name: Respawn next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RESPAWN_PAT || github.token }}
        run: |
          gh workflow run run.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" && echo "respawn requested" || echo "respawn failed (cron will restart)"
